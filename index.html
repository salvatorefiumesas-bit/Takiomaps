<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takio Maps</title>
<meta name="description" content="Navigatore per camion e mezzi pesanti con traffico in tempo reale.">
<meta name="theme-color" content="#1a73e8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takio Maps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --blu:#1a73e8; --testo:#202124; --tenue:#5f6368; --bordo:#dadce0; --sfondo:#f1f3f4;
  --verde:#188038; --rosso:#d93025;
  --ombra:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:16px/1.4 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--testo);background:#e5e3df}
#mappa{position:absolute;inset:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.card{background:#fff;border-radius:12px;box-shadow:var(--ombra)}

/* Ricerca in alto */
#ricerca{position:absolute;z-index:5;left:12px;right:12px;top:12px;top:max(12px,env(safe-area-inset-top));max-width:420px}
.ricerca-card{display:flex;gap:10px;padding:6px 14px 6px 12px}
.punti{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:14px}
.p-a{width:10px;height:10px;border-radius:50%;border:2px solid var(--tenue)}
.linea{width:2px;height:20px;background:repeating-linear-gradient(#9aa0a6 0 3px,transparent 3px 6px)}
.p-b{width:10px;height:10px;border-radius:50%;background:#ea4335}
.campi{flex:1;min-width:0}
.campi input{display:block;width:100%;border:0;background:transparent;padding:11px 2px;font-size:16px}
.campi input:first-child{border-bottom:1px solid #eee}
.campi input::placeholder{color:var(--tenue)}
.chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding:2px 2px 6px}
.chip{background:#fff;border-radius:18px;box-shadow:var(--ombra);padding:7px 14px;font-size:.9rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip svg{flex:none}

/* Pannello in basso */
#sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  border-radius:16px 16px 0 0;padding:8px 16px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
  max-height:52%;overflow-y:auto}
.maniglia{width:36px;height:4px;border-radius:2px;background:var(--bordo);margin:0 auto 10px}
.blu{background:var(--blu);color:#fff;border-radius:22px;padding:11px 22px;font-weight:500}
.blu:disabled{opacity:.6}
.bordo{background:#fff;color:var(--blu);border:1px solid var(--bordo);border-radius:22px;padding:11px 22px;font-weight:500}
#calcola{width:100%}
#stato{margin-top:8px;font-size:.9rem;color:var(--tenue)}
#stato:empty{display:none}
.errore{color:var(--rosso)!important} .ok{color:var(--verde)!important}
#riepilogo{display:none;margin-top:10px}
.tempo{display:flex;align-items:baseline;gap:10px}
#rTempo{font-size:1.6rem;font-weight:500;color:var(--verde)}
#rDistanza{font-size:1.2rem;color:var(--tenue)}
#rEta{color:var(--tenue);font-size:.95rem}
#rPause{color:var(--tenue);font-size:.85rem;margin-top:6px}
.azioni{display:flex;gap:8px;margin:12px 0 4px}
#ferma{display:none}
details{margin-top:8px;border-top:1px solid var(--bordo)}
summary{cursor:pointer;padding:12px 0;font-weight:500;color:var(--blu)}
#passi{list-style:none;margin:0;padding:0}
#passi li{padding:10px 0;border-top:1px solid #eee;font-size:.92rem;display:flex;justify-content:space-between;gap:12px}
#passi li.attivo{color:var(--blu);font-weight:500}
#passi .km{color:var(--tenue);white-space:nowrap}

/* Banner di navigazione */
#barra{display:none;position:absolute;z-index:6;left:8px;right:8px;top:8px;top:max(8px,env(safe-area-inset-top));
  max-width:460px;background:#0b6b3a;color:#fff;border-radius:14px;padding:14px 16px;gap:16px;align-items:center;box-shadow:var(--ombra)}
#barraIcona{flex:none;transition:transform .2s}
#barraDist{font-size:1.9rem;font-weight:500;line-height:1.1}
#barraTesto{font-size:1.05rem;opacity:.95}

/* In navigazione */
body.nav #ricerca,body.nav #calcola,body.nav details,body.nav #stato,body.nav #rPause{display:none}
body.nav #avvia{display:none}
body.nav #ferma{display:inline-block}
body.nav #sheet{max-height:none}
body.nav .maplibregl-ctrl-top-right{margin-top:120px}

/* Segnaposto */
.m-a{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--tenue);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.m-gps{width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 8px rgba(66,133,244,.25),0 1px 3px rgba(0,0,0,.4)}
.m-b svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* Finestra mezzo */
.modal{position:fixed;inset:0;z-index:20;background:rgba(32,33,36,.5);display:none;align-items:flex-end;justify-content:center}
.modal.aperto{display:flex}
.modal .card{width:100%;max-width:480px;max-height:92%;overflow-y:auto;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
.modal h1{font-size:1.25rem;font-weight:500;margin:0 0 14px}
.modal h2{font-size:.9rem;font-weight:500;color:var(--tenue);margin:16px 0 8px}
.modal label{display:block;font-size:.8rem;color:var(--tenue);margin-bottom:3px}
.modal input[type=text],.modal input[type=password],.modal input[type=number]{width:100%;padding:10px;border:1px solid var(--bordo);border-radius:8px;background:#fff}
.griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.griglia2{grid-template-columns:1fr 1fr}
.modal .check{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--testo);margin:8px 0}
.modal .check input{width:18px;height:18px}
.modal .blu{width:100%;margin-top:16px}

.suggerimento{font-size:.9rem;color:var(--tenue);margin:6px 0 0}
#installa{width:100%}
.crediti{color:var(--tenue);font-size:.78rem;text-align:center;margin:14px 0 0}

/* Controlli mappa */
.maplibregl-ctrl-top-right{margin-top:calc(150px + env(safe-area-inset-top,0px))}
.maplibregl-ctrl-group{border-radius:10px!important;box-shadow:var(--ombra)!important}

@media (min-width:760px){
  #ricerca{left:12px;right:auto;width:400px}
  #sheet{left:12px;right:auto;bottom:12px;width:400px;margin:0;border-radius:12px;max-height:calc(100% - 190px)}
  body.nav #sheet{max-height:none}
  .modal{align-items:center}
  .modal .card{border-radius:12px}
  .maplibregl-ctrl-top-right{margin-top:0}
  body.nav .maplibregl-ctrl-top-right{margin-top:0}
}
</style>
</head>
<body>
<div id="mappa"></div>

<div id="barra">
  <svg id="barraIcona" viewBox="0 0 24 24" width="52" height="52" aria-hidden="true"><path fill="#fff" d="M12 2 4 12h5v10h6V12h5z"/></svg>
  <div><div id="barraDist"></div><div id="barraTesto"></div></div>
</div>

<div id="ricerca">
  <div class="card ricerca-card">
    <div class="punti" aria-hidden="true"><span class="p-a"></span><span class="linea"></span><span class="p-b"></span></div>
    <div class="campi">
      <input id="partenza" placeholder="La tua posizione" aria-label="Partenza" autocomplete="off">
      <input id="arrivo" placeholder="Scegli la destinazione" aria-label="Arrivo" autocomplete="off">
    </div>
  </div>
  <div class="chips">
    <button class="chip" id="apriMezzo" aria-label="Impostazioni del mezzo">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M20 8h-3V4H3a2 2 0 0 0-2 2v11h2a3 3 0 0 0 6 0h6a3 3 0 0 0 6 0h2v-5zM6 18.5A1.5 1.5 0 1 1 6 15.5a1.5 1.5 0 0 1 0 3zm13.5-9 1.96 2.5H17v-2.5zM18 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span id="chipMezzo">Mezzo</span>
    </button>
  </div>
</div>

<div id="sheet" class="card">
  <div class="maniglia"></div>
  <button class="blu" id="calcola">Indicazioni</button>
  <div id="stato" role="status"></div>
  <div id="riepilogo">
    <div class="tempo"><span id="rTempo"></span><span id="rDistanza"></span></div>
    <div id="rEta"></div>
    <div id="rPause"></div>
    <div class="azioni">
      <button class="blu" id="avvia" disabled>Avvia</button>
      <button class="bordo" id="ferma" disabled>Esci</button>
    </div>
    <details><summary>Passaggi</summary><ol id="passi"></ol></details>
  </div>
</div>

<div class="modal" id="mezzo">
  <div class="card" role="dialog" aria-label="Impostazioni del mezzo">
    <h1>Il tuo mezzo</h1>
    <div class="griglia">
      <div><label for="altezza">Altezza (m)</label><input id="altezza" type="number" step="0.1" value="4.0"></div>
      <div><label for="larghezza">Larghezza (m)</label><input id="larghezza" type="number" step="0.1" value="2.55"></div>
      <div><label for="lunghezza">Lunghezza (m)</label><input id="lunghezza" type="number" step="0.1" value="16.5"></div>
    </div>
    <div class="griglia griglia2">
      <div><label for="peso">Peso totale (t)</label><input id="peso" type="number" step="0.5" value="40"></div>
      <div><label for="asse">Peso per asse (t)</label><input id="asse" type="number" step="0.5" value="10"></div>
    </div>
    <label class="check"><input type="checkbox" id="adr"> Merci pericolose (ADR)</label>

    <h2>Opzioni di percorso</h2>
    <label class="check"><input type="checkbox" id="pedaggi"> Evita autostrade a pedaggio</label>
    <label class="check"><input type="checkbox" id="traghetti" checked> Evita traghetti</label>
    <label class="check"><input type="checkbox" id="auto" checked> Ricalcola se esco dal percorso</label>
    <label class="check"><input type="checkbox" id="trafficoAuto" checked> Controlla il traffico ogni 5 minuti</label>

    <h2>Chiave API TomTom</h2>
    <input id="chiave" type="password" placeholder="Incolla la chiave" autocomplete="off" aria-label="Chiave API">

    <div id="boxInstalla" style="display:none">
      <h2>Installa l’app</h2>
      <button class="bordo" id="installa" style="display:none">Installa Takio Maps</button>
      <p class="suggerimento" id="suggerimentoIos" style="display:none">Su iPhone: tocca Condividi, poi “Aggiungi alla schermata Home”.</p>
    </div>

    <button class="blu" id="chiudiMezzo">Fatto</button>
    <p class="crediti">Takio Maps · percorsi e traffico TomTom · mappa © OpenStreetMap · v2</p>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";

/* ---------- Utilità ---------- */
const $ = id => document.getElementById(id);
const memoria = {
  leggi(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  scrivi(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function stato(msg, classe){ const s=$("stato"); s.textContent=msg; s.className=classe||""; }
function haversine(a,b){ // a, b = [lon,lat] -> metri
  const R=6371000, r=Math.PI/180;
  const dLat=(b[1]-a[1])*r, dLon=(b[0]-a[0])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtKm(m){ return m>=1000 ? (m/1000).toFixed(m>=10000?0:1)+" km" : Math.round(m/10)*10+" m"; }
function fmtOre(s){ const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h? h+" h "+String(m).padStart(2,"0")+" min" : m+" min"; }

/* ---------- Mappa (tiles OpenStreetMap) ---------- */
const mappa = new maplibregl.Map({
  container:"mappa",
  style:{
    version:8,
    sources:{ osm:{ type:"raster", tileSize:256, maxzoom:19,
      tiles:["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png","https://b.tile.openstreetmap.org/{z}/{x}/{y}.png","https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attribution:"© OpenStreetMap contributors" } },
    layers:[{ id:"osm", type:"raster", source:"osm" }]
  },
  center:[12.5,42.0], zoom:5, attributionControl:false
});
mappa.addControl(new maplibregl.AttributionControl({compact:true}),"top-right");
mappa.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
const geoCtrl=new maplibregl.GeolocateControl({
  positionOptions:{enableHighAccuracy:true,timeout:20000,maximumAge:5000},
  trackUserLocation:true, showAccuracyCircle:false,
  fitBoundsOptions:{maxZoom:15}
});
mappa.addControl(geoCtrl,"top-right");
geoCtrl.on("error",e=>stato(erroreGps(e),"errore"));
// All'apertura prova a centrare la mappa sulla tua posizione
mappa.on("load",()=>{ try{ geoCtrl.trigger(); }catch(e){} });

let markerA=null, markerB=null, markerGps=null;
const PIN='<svg viewBox="0 0 24 34" width="28" height="40" aria-hidden="true"><path fill="#ea4335" stroke="#b31412" d="M12 1C6 1 1.5 5.5 1.5 11.3 1.5 19 12 33 12 33s10.5-14 10.5-21.7C22.5 5.5 18 1 12 1z"/><circle cx="12" cy="11.5" r="4" fill="#fff"/></svg>';
function creaMarker(classe){
  const e=document.createElement("div"); e.className="marker "+classe;
  if(classe==="m-b") e.innerHTML=PIN;
  return e;
}
function mettiMarker(vecchio, classe, lonlat){
  if(vecchio) vecchio.remove();
  return new maplibregl.Marker({element:creaMarker(classe),anchor:classe==="m-b"?"bottom":"center"}).setLngLat(lonlat).addTo(mappa);
}

/* ---------- Stato applicazione ---------- */
let coordA=null, coordB=null;      // [lon,lat]
let percorso=null;                 // {coords, passi, distanza, durata}
let watchId=null, passoCorrente=0, ultimoParlato=-1;

/* Tocco sulla mappa = imposta arrivo */
mappa.on("click", e=>{
  coordB=[e.lngLat.lng, e.lngLat.lat];
  markerB=mettiMarker(markerB,"m-b",coordB);
  $("arrivo").value=coordB[1].toFixed(5)+", "+coordB[0].toFixed(5);
  stato("Arrivo impostato dalla mappa.");
});

/* ---------- Geocodifica (Nominatim) ---------- */
async function geocodifica(testo){
  const t=testo.trim();
  const m=t.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return [parseFloat(m[2]), parseFloat(m[1])];
  const url="https://api.tomtom.com/search/2/geocode/"+encodeURIComponent(t)+".json?limit=1&language=it-IT&key="+encodeURIComponent($("chiave").value.trim());
  const r=await fetch(url);
  if(r.status===401||r.status===403) throw new Error("Chiave TomTom non valida o senza accesso al servizio Search.");
  if(r.status===429) throw new Error("Quota giornaliera TomTom esaurita.");
  if(!r.ok) throw new Error("Ricerca indirizzo non riuscita ("+r.status+")");
  const d=await r.json();
  if(!d.results||!d.results.length) throw new Error("Indirizzo non trovato: "+t);
  return [d.results[0].position.lon, d.results[0].position.lat];
}
function erroreGps(e){
  if(!window.isSecureContext) return "Il GPS funziona solo su connessione HTTPS.";
  if(e && e.code===1) return "Permesso GPS negato: abilita la posizione per questo sito (icona lucchetto accanto all'indirizzo) e attiva il GPS del telefono.";
  if(e && e.code===3) return "Posizione non trovata in tempo: esci all'aperto e riprova.";
  return "Posizione non disponibile: controlla che il GPS del telefono sia attivo.";
}
function posizioneAttuale(){
  return new Promise((ok,ko)=>{
    if(!navigator.geolocation) return ko(new Error("GPS non disponibile su questo dispositivo."));
    const va=p=>ok([p.coords.longitude,p.coords.latitude]);
    navigator.geolocation.getCurrentPosition(va,
      e1=>{
        if(e1.code===1) return ko(new Error(erroreGps(e1)));
        // secondo tentativo con precisione normale (rete/Wi-Fi)
        navigator.geolocation.getCurrentPosition(va,e2=>ko(new Error(erroreGps(e2))),
          {enableHighAccuracy:false,timeout:15000,maximumAge:60000});
      },
      {enableHighAccuracy:true,timeout:10000,maximumAge:5000});
  });
}

/* ---------- Richiesta percorso camion (TomTom Routing API) ---------- */
const VELOCITA_MAX_KMH=80;   // velocità massima del mezzo, usata per stimare i tempi

function parametriMezzo(){
  const q=new URLSearchParams({
    travelMode:"truck", traffic:"true", routeType:"fastest",
    instructionsType:"text", language:"it-IT", sectionType:"travelMode",
    vehicleCommercial:"true", vehicleMaxSpeed:String(VELOCITA_MAX_KMH),
    vehicleHeight:$("altezza").value, vehicleWidth:$("larghezza").value, vehicleLength:$("lunghezza").value,
    vehicleWeight:String(Math.round(+$("peso").value*1000)),
    vehicleAxleWeight:String(Math.round(+$("asse").value*1000))
  });
  if($("traghetti").checked) q.append("avoid","ferries");
  if($("pedaggi").checked) q.append("avoid","tollRoads");
  if($("adr").checked) q.append("vehicleLoadType","otherHazmatGeneral");
  return q;
}
function messaggioErrore(r,dati){
  const msg=(dati&&(dati.detailedError&&dati.detailedError.message||dati.error&&dati.error.description||dati.errorText))||("Errore "+r.status);
  if(r.status===401||r.status===403) return "Chiave TomTom non valida o senza accesso al servizio Routing.";
  if(r.status===429) return "Troppe richieste o quota giornaliera TomTom esaurita.";
  if(/route/i.test(msg)) return "Nessun percorso compatibile con le dimensioni del mezzo. Prova a ridurre i vincoli o cambia destinazione. ("+msg+")";
  return msg;
}
function convertiRotta(r){
  const coords=[];
  r.legs.forEach(l=>l.points.forEach(pt=>coords.push([pt.longitude,pt.latitude])));
  const lunghezza=r.summary.lengthInMeters;
  const istr=(r.guidance&&r.guidance.instructions)||[];
  const passi=istr.map((it,i)=>{
    const fine=i+1<istr.length?istr[i+1].routeOffsetInMeters:lunghezza;
    return { testo:it.message||"Prosegui", dist:Math.max(0,fine-it.routeOffsetInMeters),
             punto:[it.point.longitude,it.point.latitude], tipo:it.maneuver };
  });
  if(!passi.length) passi.push({ testo:"Segui il percorso", dist:lunghezza, punto:coords[0], tipo:"STRAIGHT" });
  return {
    coords, passi, distanza:lunghezza, durata:r.summary.travelTimeInSeconds,
    ritardo:r.summary.trafficDelayInSeconds||0,                    // minuti persi per il traffico (in secondi)
    rif:{ t:r.summary.travelTimeInSeconds, d:lunghezza },          // tempo e distanza di riferimento per le stime
    avviso:(r.sections||[]).some(s=>s.sectionType==="TRAVEL_MODE"&&s.travelMode==="other")
  };
}
// Senza "punti": percorso nuovo. Con "punti": rivaluta il percorso che stai seguendo e cerca alternative migliori.
async function richiediRotte(da,a,chiave,opzioni){
  const o=opzioni||{};
  const q=parametriMezzo(); q.set("key",chiave);
  if(o.punti){
    q.set("reconstructionMode","update");
    q.set("maxAlternatives",String(o.alternative||1));
    q.set("alternativeType","betterRoute");
  }
  const url="https://api.tomtom.com/routing/1/calculateRoute/"+da[1]+","+da[0]+":"+a[1]+","+a[0]+"/json?"+q.toString();
  const init=o.punti?{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ supportingPoints:o.punti.map(c=>({ latitude:c[1], longitude:c[0] })) })
  }:{};
  const r=await fetch(url,init);
  let dati={}; try{ dati=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(messaggioErrore(r,dati));
  if(!dati.routes||!dati.routes.length) throw new Error("Nessun percorso trovato.");
  return dati.routes.map(convertiRotta);
}
async function ottieniPercorso(da,a,chiave){ return (await richiediRotte(da,a,chiave))[0]; }

/* ---------- Calcolo del percorso ---------- */
async function calcola(){
  const chiave=$("chiave").value.trim();
  if(!chiave) return stato("Inserisci la chiave API TomTom.","errore");
  memoria.scrivi("tomtom_key",chiave);
  $("calcola").disabled=true; stato("Calcolo in corso…");
  try{
    const pTesto=$("partenza").value.trim(), aTesto=$("arrivo").value.trim();
    if(!aTesto) throw new Error("Inserisci la destinazione.");
    coordA = (!pTesto || /^qui$/i.test(pTesto)) ? await posizioneAttuale() : await geocodifica(pTesto);
    coordB = await geocodifica(aTesto);
    markerA=mettiMarker(markerA,"m-a",coordA);
    markerB=mettiMarker(markerB,"m-b",coordB);

    percorso=await ottieniPercorso(coordA,coordB,chiave);
    disegna(true); riepilogo();
    $("avvia").disabled=false;
    stato("Percorso pronto.","ok");
  }catch(e){
    stato(e.message,"errore");
  }finally{
    $("calcola").disabled=false;
  }
}

function disegna(adatta){
  const geo={type:"Feature",geometry:{type:"LineString",coordinates:percorso.coords}};
  if(mappa.getSource("rotta")){
    mappa.getSource("rotta").setData(geo);
  }else{
    mappa.addSource("rotta",{type:"geojson",data:geo});
    mappa.addLayer({id:"rotta-bordo",type:"line",source:"rotta",
      layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#1a56c4","line-width":10}});
    mappa.addLayer({id:"rotta",type:"line",source:"rotta",
      layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#4285f4","line-width":6}});
  }
  const b=percorso.coords.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(percorso.coords[0],percorso.coords[0]));
  if(adatta) mappa.fitBounds(b,{padding:60,duration:800});
}

function fmtEta(sec){ return new Date(Date.now()+sec*1000).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
function testoEta(sec,ritardo){
  return "Arrivo alle "+fmtEta(sec)+(ritardo>=60?" (traffico: +"+Math.round(ritardo/60)+" min)":"");
}

/* ---------- Riepilogo e pause tachigrafo (Reg. CE 561/2006) ---------- */
function riepilogo(){
  $("riepilogo").style.display="block";
  $("rDistanza").textContent=fmtKm(percorso.distanza);
  $("rTempo").textContent=fmtOre(percorso.durata);
  $("rEta").textContent=testoEta(percorso.durata,percorso.ritardo);

  // Stima: pausa di 45' ogni 4h30 di guida. Limite giornaliero 9h (10h due volte a settimana).
  const GUIDA_MAX=4.5*3600;
  const pause=Math.floor((percorso.durata-1)/GUIDA_MAX);
  let nota="";
  if(pause>0) nota+=pause+(pause===1?" pausa":" pause")+" da 45 min (ogni 4 h 30 di guida). ";
  else nota+="Nessuna pausa obbligatoria durante questo tragitto. ";
  if(percorso.durata>9*3600) nota+="Supera 9 h di guida: serve un riposo giornaliero.";
  if(percorso.avviso) nota+=" Attenzione: una parte del tragitto potrebbe non essere adatta ai camion, controlla i segnali.";
  $("rPause").textContent=nota+" Stima indicativa, non sostituisce il tachigrafo.";

  const ol=$("passi"); ol.innerHTML="";
  percorso.passi.forEach((p,i)=>{
    const li=document.createElement("li"); li.id="p"+i;
    const a=document.createElement("span"); a.textContent=p.testo;
    const b=document.createElement("span"); b.className="km"; b.textContent=fmtKm(p.dist);
    li.append(a,b); ol.append(li);
  });
}

/* ---------- Fuori percorso e ricalcolo automatico ---------- */
const SOGLIA_FUORI_M=50;        // distanza minima dalla rotta per considerarsi fuori
const FIX_CONSECUTIVI=3;        // letture GPS di fila fuori rotta prima di agire
const PAUSA_RICALCOLO_MS=20000; // attesa minima tra due ricalcoli (limita le chiamate API)
let fuoriCount=0, ultimoRicalcolo=0, ricalcolando=false;

function distanzaDaRotta(pos){
  const r=Math.PI/180, k=Math.cos(pos[1]*r), m=111320;
  const px=pos[0]*k*m, py=pos[1]*m, c=percorso.coords;
  let min=Infinity;
  for(let i=0;i<c.length-1;i++){
    const ax=c[i][0]*k*m, ay=c[i][1]*m, bx=c[i+1][0]*k*m, by=c[i+1][1]*m;
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;
    t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    if(d<min) min=d;
  }
  return min;
}
function controllaFuoriRotta(pos,precisione){
  if(!$("auto").checked || ricalcolando || !percorso || !coordB) return;
  const soglia=Math.max(SOGLIA_FUORI_M,(precisione||0)*1.5);
  if(distanzaDaRotta(pos)<=soglia){ fuoriCount=0; return; }
  fuoriCount++;
  if(fuoriCount>=FIX_CONSECUTIVI && Date.now()-ultimoRicalcolo>PAUSA_RICALCOLO_MS) ricalcola(pos);
}
async function ricalcola(pos){
  ricalcolando=true; ultimoRicalcolo=Date.now(); fuoriCount=0; ultimoControlloTraffico=Date.now();
  stato("Fuori percorso: ricalcolo…");
  parla("Ricalcolo del percorso.");
  try{
    percorso=await ottieniPercorso(pos,coordB,$("chiave").value.trim());
    passoCorrente=0; ultimoParlato=-1;
    disegna(false); riepilogo(); evidenzia(0);
    stato("Percorso ricalcolato.","ok");
    parla(percorso.passi[0].testo);
  }catch(e){
    stato("Ricalcolo non riuscito: "+e.message+". Riprovo tra pochi secondi.","errore");
  }finally{
    ricalcolando=false;
  }
}

/* ---------- Controllo del traffico durante la guida ---------- */
const INTERVALLO_TRAFFICO_MS=5*60*1000; // ogni quanto chiedere a TomTom un percorso aggiornato
const RISPARMIO_MIN_S=180;              // cambia strada solo se risparmi almeno 3 minuti
let ultimoControlloTraffico=0, controllandoTraffico=false;

function metriResidui(pos){
  const k=Math.min(passoCorrente+1,percorso.passi.length-1);
  let rim=haversine(pos,percorso.passi[k].punto);
  for(let i=passoCorrente+1;i<percorso.passi.length;i++) rim+=percorso.passi[i].dist;
  return rim;
}
function puntiRimanenti(pos){
  let migliore=0, min=Infinity;
  percorso.coords.forEach((c,i)=>{ const d=haversine(pos,c); if(d<min){ min=d; migliore=i; } });
  return [pos,...percorso.coords.slice(migliore+1)];
}
async function controllaTraffico(pos){
  if(!$("trafficoAuto").checked||ricalcolando||controllandoTraffico||!percorso||!coordB) return;
  if(Date.now()-ultimoControlloTraffico<INTERVALLO_TRAFFICO_MS) return;
  controllandoTraffico=true; ultimoControlloTraffico=Date.now();
  try{
    const punti=puntiRimanenti(pos);
    if(punti.length<2) return;
    // Il primo risultato è il percorso attuale con il traffico di adesso; il secondo, se c'è, è una alternativa migliore
    const lista=await richiediRotte(pos,coordB,$("chiave").value.trim(),{punti:punti,alternative:1});
    if(watchId===null) return;   // nel frattempo hai fermato la navigazione
    const attuale=lista[0], alt=lista[1];
    if(alt && attuale.durata-alt.durata>=RISPARMIO_MIN_S){
      const min=Math.round((attuale.durata-alt.durata)/60);
      percorso=alt; passoCorrente=0; ultimoParlato=-1;
      disegna(false); riepilogo(); evidenzia(0);
      parla("Trovato un percorso più veloce per il traffico. Risparmi circa "+min+(min===1?" minuto.":" minuti."));
      stato("Percorso aggiornato per il traffico: risparmi circa "+min+" min.","ok");
    }else{
      percorso.rif=attuale.rif; percorso.ritardo=attuale.ritardo;   // nessuna strada migliore: aggiorno solo i tempi
    }
  }catch(e){
    // il controllo è facoltativo: se fallisce si continua con il percorso attuale
  }finally{
    controllandoTraffico=false;
  }
}

/* ---------- Navigazione GPS con voce ---------- */
function parla(testo){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(testo); u.lang="it-IT"; u.rate=1.0;
  speechSynthesis.speak(u);
}
function evidenzia(i){
  document.querySelectorAll("#passi li.attivo").forEach(e=>e.classList.remove("attivo"));
  const el=$("p"+i); if(el){ el.classList.add("attivo"); el.scrollIntoView({block:"nearest"}); }
}
// Rotazione della freccia (su = dritto) per i codici di manovra di TomTom
const GRADI_MANOVRA={
  STRAIGHT:0, FOLLOW:0, DEPART:0, ARRIVE:0, ARRIVE_LEFT:-90, ARRIVE_RIGHT:90,
  KEEP_RIGHT:25, BEAR_RIGHT:45, TURN_RIGHT:90, SHARP_RIGHT:135,
  KEEP_LEFT:-25, BEAR_LEFT:-45, TURN_LEFT:-90, SHARP_LEFT:-135,
  MAKE_UTURN:180, TRY_MAKE_UTURN:180,
  ENTER_MOTORWAY:0, ENTER_FREEWAY:0, ENTER_HIGHWAY:0, ENTRANCE_RAMP:0, TAKE_EXIT:30,
  MOTORWAY_EXIT_LEFT:-30, MOTORWAY_EXIT_RIGHT:30, TAKE_FERRY:0,
  ROUNDABOUT_CROSS:0, ROUNDABOUT_RIGHT:60, ROUNDABOUT_LEFT:-60, ROUNDABOUT_BACK:180,
  SWITCH_PARALLEL_ROAD:0, SWITCH_MAIN_ROAD:0, WAYPOINT_LEFT:-90, WAYPOINT_RIGHT:90, WAYPOINT_REACHED:0
};
function aggiornaBarra(pos){
  const p=percorso.passi[passoCorrente]; if(!p) return;
  const prossimo=percorso.passi[passoCorrente+1] || p;
  const d=haversine(pos,prossimo.punto);
  $("barra").style.display="flex";
  $("barraTesto").textContent=prossimo.testo;
  $("barraDist").textContent=fmtKm(d);
  $("barraIcona").style.transform="rotate("+(GRADI_MANOVRA[prossimo.tipo]||0)+"deg)";
  // Distanza e tempo residui, aggiornati dal GPS
  const rim=metriResidui(pos);
  const resto=percorso.rif.t*Math.min(1,rim/(percorso.rif.d||1));
  $("rDistanza").textContent=fmtKm(rim);
  $("rTempo").textContent=fmtOre(resto);
  $("rEta").textContent=testoEta(resto,percorso.ritardo);
  // Avviso vocale a ~300 m dalla manovra, una sola volta per passo
  if(d<300 && ultimoParlato!==passoCorrente){
    ultimoParlato=passoCorrente;
    parla("Tra "+(d<100?"poco":Math.round(d/50)*50+" metri")+", "+prossimo.testo);
  }
  // Manovra raggiunta: passa al passo successivo
  if(d<35 && passoCorrente<percorso.passi.length-1){
    passoCorrente++; evidenzia(passoCorrente);
  }
}
function avvia(){
  if(!percorso) return;
  if(!navigator.geolocation) return stato("GPS non disponibile su questo dispositivo.","errore");
  passoCorrente=0; ultimoParlato=-1; fuoriCount=0; ultimoRicalcolo=0; ultimoControlloTraffico=Date.now(); evidenzia(0);
  parla("Navigazione avviata. "+percorso.passi[0].testo);
  $("avvia").disabled=true; $("ferma").disabled=false;
  document.body.classList.add("nav");
  tieniSchermoAcceso(true);
  watchId=navigator.geolocation.watchPosition(p=>{
    const pos=[p.coords.longitude,p.coords.latitude];
    markerGps=markerGps ? markerGps.setLngLat(pos) : mettiMarker(null,"m-gps",pos);
    mappa.easeTo({center:pos,zoom:16,bearing:p.coords.heading||mappa.getBearing(),duration:700});
    aggiornaBarra(pos);
    controllaFuoriRotta(pos,p.coords.accuracy);
    controllaTraffico(pos);
    if(haversine(pos,coordB)<40){ parla("Sei arrivato a destinazione."); ferma(); stato("Sei arrivato.","ok"); }
  },()=>stato("Segnale GPS perso.","errore"),
  {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  stato("Navigazione attiva.","ok");
}
function ferma(){
  document.body.classList.remove("nav");
  tieniSchermoAcceso(false);
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  speechSynthesis && speechSynthesis.cancel();
  $("barra").style.display="none";
  $("avvia").disabled=!percorso; $("ferma").disabled=true;
  mappa.easeTo({pitch:0,bearing:0,duration:500});
  if(percorso) riepilogo();
  stato("Navigazione ferma.");
}

/* ---------- Collegamenti ---------- */
$("calcola").addEventListener("click",calcola);
$("avvia").addEventListener("click",avvia);
$("ferma").addEventListener("click",ferma);
["partenza","arrivo"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter") calcola(); }));

/* Ripristina chiave e dati mezzo salvati */
$("chiave").value=memoria.leggi("tomtom_key");
["altezza","larghezza","lunghezza","peso","asse"].forEach(id=>{
  const v=memoria.leggi("mezzo_"+id); if(v) $(id).value=v;
  $(id).addEventListener("change",()=>memoria.scrivi("mezzo_"+id,$(id).value));
});

/* ---------- Finestra del mezzo ---------- */
function aggiornaChip(){
  $("chipMezzo").textContent=($("altezza").value||"?")+" m, "+($("peso").value||"?")+" t"+($("adr").checked?", ADR":"");
}
function finestraMezzo(aperta){
  $("mezzo").classList.toggle("aperto",aperta);
  if(!aperta){ aggiornaChip(); memoria.scrivi("tomtom_key",$("chiave").value.trim()); }
}
$("apriMezzo").addEventListener("click",()=>finestraMezzo(true));
$("chiudiMezzo").addEventListener("click",()=>finestraMezzo(false));
$("mezzo").addEventListener("click",e=>{ if(e.target===$("mezzo")) finestraMezzo(false); });
aggiornaChip();
if(!$("chiave").value) finestraMezzo(true);

/* ---------- Schermo sempre acceso durante la navigazione ---------- */
let bloccoSchermo=null;
async function tieniSchermoAcceso(attivo){
  try{
    if(attivo){
      if("wakeLock" in navigator && !bloccoSchermo){
        bloccoSchermo=await navigator.wakeLock.request("screen");
        bloccoSchermo.addEventListener("release",()=>{ bloccoSchermo=null; });
      }
    }else if(bloccoSchermo){
      await bloccoSchermo.release(); bloccoSchermo=null;
    }
  }catch(e){ bloccoSchermo=null; }
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && watchId!==null) tieniSchermoAcceso(true);
});

/* ---------- App installabile (PWA) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
let eventoInstalla=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); eventoInstalla=e;
  $("boxInstalla").style.display="block"; $("installa").style.display="block";
});
$("installa").addEventListener("click",async()=>{
  if(!eventoInstalla) return;
  eventoInstalla.prompt();
  try{ await eventoInstalla.userChoice; }catch(e){}
  eventoInstalla=null; $("boxInstalla").style.display="none";
});
window.addEventListener("appinstalled",()=>{ $("boxInstalla").style.display="none"; });
const eIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
const giaInstallata=window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if(eIos && !giaInstallata){ $("boxInstalla").style.display="block"; $("suggerimentoIos").style.display="block"; }
</script>
</body>
